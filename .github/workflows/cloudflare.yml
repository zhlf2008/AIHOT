name: Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run cf:check
      - run: npm run cf:full:build
  deploy:
    # The Supabase schema and billing plan must be reviewed before deployment.
    # Keep production releases explicit; never overwrite the full site with the D1 index.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Deploy full Cloudflare runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run cf:full:deploy:media
          npm run cf:full:deploy:api
          npm run cf:full:deploy:web
          npx wrangler deploy --config modules/cloudflare-full/jobs/wrangler.jsonc --var COLLECT_ENABLED:true --var MODEL_CALLS_ENABLED:true
          npm run cf:full:deploy:production
